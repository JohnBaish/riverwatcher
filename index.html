<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riverwatcher – river levels in England</title>
    <meta name="description" content="Free river levels for anywhere in England, by postcode or county. See whether rivers are high or low for the time of year, from Environment Agency gauges." />
    <link rel="canonical" href="https://riverwatcher.baish.net/" />
    <!-- Search (SEO): the <title> and search description are for search results (John,
         November 2nd 2026); the canonical link names the one main address. The og:/twitter:
         tags below are for link previews and keep the shorter wording drawn into the preview
         picture (design/og-riverwatcher.html). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Riverwatcher" />
    <meta property="og:description" content="River levels in your chosen area, with historical comparisons." />
    <meta property="og:image" content="https://riverwatcher.baish.net/og-riverwatcher.png" />
    <meta property="og:url" content="https://riverwatcher.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Riverwatcher" />
    <meta name="twitter:description" content="River levels in your chosen area, with historical comparisons." />
    <meta name="twitter:image" content="https://riverwatcher.baish.net/og-riverwatcher.png" />
    <!-- Dark mode: set before the page draws, so there's no flash of the wrong colours. A
         choice kept by the switch wins; otherwise the device's own setting (John, 29 October).
         The same key and rule as src/lib/theme.ts. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('riverwatcher.theme') } catch (e) {}
        var device = false
        try { device = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        if (t === 'dark' || (t !== 'light' && device)) document.documentElement.dataset.theme = 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
